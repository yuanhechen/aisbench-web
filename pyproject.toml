[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aisbench-web"
version = "0.1.0"
description = "A web interface for the official AISBench CLI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "argon2-cffi>=23.1,<26",
    "cryptography>=44,<47",
    "httpx>=0.28,<1",
]

[project.optional-dependencies]
dev = [
    "build>=1.2,<2",
    "pytest>=8,<10",
    "pytest-cov>=6,<8",
    "pytest-asyncio>=0.25,<2",
    "ruff>=0.9,<1",
]

[project.scripts]
aisbench-web = "aisbench_web.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
